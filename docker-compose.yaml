services:
  database:
    image: postgres:15-alpine
    container_name: minjibot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TESTING_DB: ${TESTING_DB}
    ports:
      - "5434:5432"
    volumes:
      - minjibot-postgres-data:/var/lib/postgresql/data
      - ./init-testdb.sh:/docker-entrypoint-initdb.d/init-testdb.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  minjibot-postgres-data:
