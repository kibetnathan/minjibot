# Railway deployment config (config-as-code) for the MinjiBot bot + API service.
#
# This file configures a single service deployment (see
# https://docs.railway.com/reference/config-as-code). Railway uses the Dockerfile
# at the repo root: it compiles the binary at build time, then the container
# command (scripts/migrate.sh) runs goose migrations and starts the prebuilt
# bot + API on :8080.
#
# The Postgres database is provided by a Railway "Postgres" plugin service
# (created in the dashboard); reference its connection string via the
# MINJIBOT_DB_URL variable below.

[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "sh /app/scripts/migrate.sh"
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# In the Railway dashboard, reference the Postgres plugin's connection URI with
# the variable name DATABASE_URL (default) or add a variable DB_URL pointing at
# it. The migrate script falls back to DB_URL, then DATABASE_URL, so a single
# plugin reference is enough. Set DISCORD_TOKEN / DISCORD_CLIENT_ID /
# DISCORD_CLIENT_SECRET (and optionally the Google/Gemini keys) as variables.
