# Railway deployment config (config-as-code) for MinjiBot.
#
# This configures a single service that runs BOTH the Discord bot and the Echo
# HTTP API through the unified entrypoint (cmd/main.go). The Dockerfile at the
# repo root builds that unified binary at build time; the container start
# command (scripts/migrate.sh) runs goose migrations, then starts the binary.
#
# Railway provides a Postgres "plugin" service (created in the dashboard).
# Reference its connection URI via DATABASE_URL (or DB_URL); scripts/migrate.sh
# prefers GOOSE_DBSTRING, then DB_URL, then DATABASE_URL.

[build]
builder = "DOCKERFILE"

[deploy]
# Run the unified bot + API entrypoint. migrate.sh applies goose migrations,
# then `exec`s the prebuilt binary from /app/minjibot.
startCommand = "sh /app/scripts/migrate.sh"

# The unified entrypoint starts the API immediately and the bot in a goroutine,
# so /healthz responds as soon as the HTTP server binds. Railway injects the
# PORT env var; the API binds to it (see internal/config, default :8080).
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Required variables (set in the Railway dashboard, scoped to this service):
#  - DATABASE_URL / DB_URL    Postgres plugin connection URI (used by app + goose)
#  - DISCORD_TOKEN            bot token used by the Discord gateway
#  - DISCORD_CLIENT_ID        application id used for slash command registration
#  - DISCORD_CLIENT_SECRET    used by the dashboard OAuth (Sign in with Discord)
#  - APP_URL                  base URL + port the API is served on (must match the
#                             OAuth callback registered in the Discord Developer
#                             Portal, e.g. https://api.domain.com)
#  - SESSION_SECRET           secret used to sign dashboard session cookies
# Optional:
#  - GOOGLE_FACTCHECK_API_KEY, GEMINI_API_KEY, GEMINI_MODEL, REDDIT_CLIENT_ID,
#    REDDIT_CLIENT_SECRET, GOOSE_VERBOSE