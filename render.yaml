# Render blueprint for deploying the MinjiBot bot + database.
#
# Services
#   - minjibot-db  : managed Postgres
#   - minjibot-bot : background worker running the Discord bot (gateway).
#
# The bot connects outbound to Discord over the gateway, so it is a
# background worker (no inbound web traffic required). It uses the Dockerfile
# with the startup command set to scripts/migrate.sh, which builds the binary,
# runs migrations, then starts the bot. (Free tier has no pre-deploy hooks.)

databases:
  - name: minjibot-db
    databaseName: minjibot
    user: minjibot
    plan: free
    ipAllowList: [] # only allow internal connections

services:
  - type: worker
    name: minjibot-bot
    runtime: docker
    repo: https://github.com/kibetnathan/minjibot
    branch: develop
    dockerfilePath: ./Dockerfile
    dockerCommand: ./scripts/migrate.sh
    plan: free
    envVars:
      - key: DB_URL
        fromDatabase:
          name: minjibot-db
          property: connectionString
      - key: GOOSE_DBSTRING
        fromDatabase:
          name: minjibot-db
          property: connectionString
      - key: GOOSE_DRIVER
        value: postgres
      # --- Discord ---
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      # --- Optional integrations (leave blank if unused) ---
      - key: GOOGLE_FACTCHECK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
