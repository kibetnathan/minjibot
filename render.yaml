# Render blueprint for deploying the MinjiBot bot + database.
#
# Services
#   - minjibot-db  : managed Postgres
#   - minjibot-bot : web service running the Discord bot (gateway) + API.
#
# The bot connects outbound to Discord over the gateway. On the free tier only
# `web` services are available, so this is a web service whose health check
# hits the API's `/healthz` endpoint (see internal/api/app.go). The container
# command is scripts/migrate.sh, which builds the binary, runs migrations,
# then starts the bot + API on :8080.

databases:
  - name: minjibot-db
    databaseName: minjibot
    user: minjibot
    plan: free
    ipAllowList: [] # only allow internal connections

services:
  - type: web
    name: minjibot-bot
    runtime: docker
    repo: https://github.com/kibetnathan/minjibot
    branch: main
    dockerfilePath: ./Dockerfile
    dockerCommand: ./scripts/migrate.sh
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: DB_URL
        fromDatabase:
          name: minjibot-db
          property: connectionString
      - key: GOOSE_DBSTRING
        fromDatabase:
          name: minjibot-db
          property: connectionString
      - key: GOOSE_DRIVER
        value: postgres
      # --- Discord ---
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      # --- Optional integrations (leave blank if unused) ---
      - key: GOOGLE_FACTCHECK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
